<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MIDI → GRAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--s1:#0e1219;--s2:#131920;--s3:#181f28;
  --b:rgba(120,160,255,.09);--b2:rgba(120,160,255,.18);
  --a:#3dfcbe;--a2:#9b7fff;--a3:#ffb347;
  --t:#d8eaf8;--m:#4e6070;--d:#1e2d3d;
  --err:#ff5060;--ok:#3dfcbe;--warn:#ffca55;
  --mono:'Space Mono',monospace;--ui:'Syne',sans-serif;
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);color:var(--t);background:var(--bg);min-height:100vh;overflow-x:hidden;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(61,252,190,.04) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(155,127,255,.04) 0%,transparent 60%);}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:orbmove 22s ease-in-out infinite alternate}
.orb1{width:600px;height:400px;background:rgba(61,252,190,.055);top:-180px;left:-200px}
.orb2{width:450px;height:450px;background:rgba(155,127,255,.045);bottom:-180px;right:-120px}
@keyframes orbmove{from{transform:translate(0,0)}to{transform:translate(35px,25px)}}

.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:18px}

/* ── Header ── */
.hdr{background:var(--s1);border:1px solid var(--b);border-radius:20px;padding:30px 32px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(61,252,190,.2),transparent);pointer-events:none}
.hdr-l h1{font-size:clamp(30px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px}
.hdr-l h1 .ac{color:var(--a)}
.hdr-l p{color:var(--m);font-size:13px;line-height:1.75;max-width:50ch}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{padding:5px 13px;border-radius:8px;font-size:11px;letter-spacing:.04em;border:1px solid var(--b2);background:rgba(255,255,255,.03);color:var(--m);font-weight:600}
.tag.t2{color:var(--a2);border-color:rgba(155,127,255,.2);background:rgba(155,127,255,.04)}
.tag.t3{color:var(--a3);border-color:rgba(255,179,71,.2);background:rgba(255,179,71,.04)}
.stats-col{display:flex;flex-direction:column;gap:8px;min-width:140px}
.stat-card{background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:12px 15px;text-align:right}
.stat-v{font-family:var(--mono);font-size:20px;color:var(--a);line-height:1;margin-bottom:2px}
.stat-l{font-size:11px;color:var(--m);letter-spacing:.04em}

/* ── Tab nav ── */
.tab-nav{display:flex;gap:3px;background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:4px}
.tab-btn{flex:1;border:none;border-radius:9px;padding:10px 14px;font-family:var(--ui);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--m);background:transparent}
.tab-btn:hover{color:var(--t);background:rgba(255,255,255,.03)}
.tab-btn.active{background:var(--s2);color:var(--t);box-shadow:0 0 0 1px var(--b)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── Panel ── */
.panel{background:var(--s1);border:1px solid var(--b);border-radius:var(--radius);overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--b);background:rgba(255,255,255,.015)}
.ph-dots{display:flex;gap:5px}
.ph-dots span{width:9px;height:9px;border-radius:50%}
.da{background:#ff5f57}.db{background:#febc2e}.dc{background:#28c840}
.ph-title{font-size:12px;color:var(--m);font-weight:600;letter-spacing:.02em}
.pb{padding:16px;display:flex;flex-direction:column;gap:12px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:11px;color:var(--m);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.field>label::after{content:'';flex:1;height:1px;background:var(--b)}
.drop{border:1px dashed var(--b2);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.015);position:relative}
.drop:hover,.drop.ov{border-color:var(--a);background:rgba(61,252,190,.04)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-ico{font-size:26px;margin-bottom:5px;line-height:1}
.drop-txt{font-size:12px;color:var(--m);line-height:1.6}
.drop-txt strong{color:var(--t)}

input[type=number],input[type=text],select{
  width:100%;background:var(--s2);border:1px solid var(--b);border-radius:9px;
  padding:9px 12px;font-size:13px;color:var(--t);
  outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;font-family:inherit
}
input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(61,252,190,.07)}
select option{background:var(--s2)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Voice slider */
.voice-field{display:flex;flex-direction:column;gap:9px;background:rgba(155,127,255,.04);border:1px solid rgba(155,127,255,.14);border-radius:12px;padding:13px 14px}
.voice-field>label{font-size:11px;color:var(--a2);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.voice-field>label::after{content:'';flex:1;height:1px;background:rgba(155,127,255,.15)}
.voice-row{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:999px;outline:none;cursor:pointer;border:none;padding:0;background:rgba(255,255,255,.08);box-shadow:none}
input[type=range]:focus{box-shadow:none;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--a2);border:2px solid var(--bg);box-shadow:0 0 8px rgba(155,127,255,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--a2);border:2px solid var(--bg);cursor:pointer}
.voice-num-input{width:62px;flex-shrink:0;text-align:center;background:var(--s2);border:1px solid rgba(155,127,255,.25);border-radius:8px;padding:7px 8px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--a2);-webkit-appearance:none}
.voice-hint{font-size:11px;color:var(--m);line-height:1.6}
.voice-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(155,127,255,.12);border:1px solid rgba(155,127,255,.25);color:var(--a2);margin-left:auto}

/* Buttons */
.btn{border:none;border-radius:10px;padding:10px 16px;font-family:var(--ui);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-p{background:var(--a);color:#03100c}
.btn-p:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 4px 20px rgba(61,252,190,.2)}
.btn-p:active{transform:scale(.97)}
.btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn-s{background:rgba(155,127,255,.08);color:var(--a2);border:1px solid rgba(155,127,255,.25)}
.btn-s:hover{background:rgba(155,127,255,.14)}
.btn-s:disabled{opacity:.35;cursor:not-allowed}
.btn-d{background:rgba(255,80,96,.06);color:var(--err);border:1px solid rgba(255,80,96,.2)}
.btn-d:hover{background:rgba(255,80,96,.1)}
.btn-d:disabled{opacity:.35;cursor:not-allowed}
.btn-w{background:transparent;color:var(--warn);border:1px solid rgba(255,202,85,.25)}
.btn-w:hover{background:rgba(255,202,85,.07)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* Status */
.status{border-radius:10px;border:1px solid var(--b);background:var(--s2);padding:10px 13px;font-size:12px;color:var(--m);min-height:40px;line-height:1.6;transition:all .18s}
.status.ok{border-color:rgba(61,252,190,.25);color:var(--ok)}
.status.err{border-color:rgba(255,80,96,.25);color:var(--err)}
.status.warn{border-color:rgba(255,202,85,.25);color:var(--warn)}
.status.load{border-color:rgba(155,127,255,.25);color:var(--a2)}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:7px;background:rgba(255,255,255,.03);border:1px solid var(--b);font-size:11px;color:var(--m)}
.pill b{color:var(--t)}

/* Canvas / roll */
.cv-wrap{position:relative;background:var(--bg);min-height:260px;overflow:hidden}
.cv-wrap canvas{display:block;width:100%}
.cv-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--m);font-size:12px;gap:8px;z-index:3;pointer-events:none}
.cv-empty .ico{font-size:32px}
.cv-leg{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--b);font-size:11px;color:var(--m)}
.leg-item{display:flex;align-items:center;gap:6px}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* Note table */
.nt-wrap{max-height:180px;overflow-y:auto;border-top:1px solid var(--b);scrollbar-width:thin;scrollbar-color:var(--d) transparent}
.nt{width:100%;border-collapse:collapse;font-size:11px}
.nt th{position:sticky;top:0;background:var(--s2);color:var(--m);font-weight:600;padding:7px 12px;text-align:left;border-bottom:1px solid var(--b);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.nt td{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.025);font-family:var(--mono)}
.nt tr:last-child td{border:none}
.nt tr:hover td{background:rgba(255,255,255,.02)}
.ndot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Code box */
.code{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:12px 14px;max-height:200px;overflow:auto;font-family:var(--mono);font-size:11px;color:#7aceff;line-height:1.7;white-space:pre;scrollbar-width:thin;scrollbar-color:var(--d) transparent}

/* ── Grid layouts ── */
.main-grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}

/* ── COMPILER TAB ── */
.compiler-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.midi-slot{border:1px solid var(--b);border-radius:11px;padding:13px;background:rgba(255,255,255,.02);display:flex;align-items:center;gap:12px;transition:all .2s;position:relative}
.midi-slot.filled{border-color:rgba(61,252,190,.2);background:rgba(61,252,190,.03)}
.slot-num{font-size:11px;color:var(--m);min-width:18px;font-family:var(--mono)}
.slot-ico{font-size:18px;color:var(--m);flex-shrink:0}
.midi-slot.filled .slot-ico{color:var(--a)}
.slot-info{flex:1;min-width:0}
.slot-name{font-size:12px;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.slot-meta{font-size:11px;color:var(--m);margin-top:2px}
.slot-remove{border:none;background:transparent;color:var(--err);cursor:pointer;font-size:14px;padding:4px;border-radius:6px;transition:background .15s;flex-shrink:0}
.slot-remove:hover{background:rgba(255,80,96,.1)}
.slot-drop{border:1px dashed var(--b2);border-radius:10px;padding:15px 12px;text-align:center;cursor:pointer;position:relative;transition:.2s;background:rgba(255,255,255,.01)}
.slot-drop:hover,.slot-drop.ov{border-color:var(--a);background:rgba(61,252,190,.04)}
.slot-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.slot-drop-txt{font-size:11px;color:var(--m)}
.offset-input{width:70px;flex-shrink:0;background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--t);text-align:right;-webkit-appearance:none;font-family:var(--mono)}
.offset-input:focus{border-color:var(--a);outline:none;box-shadow:0 0 0 2px rgba(61,252,190,.07)}
.offset-label{font-size:10px;color:var(--m)}
.midi-stack{display:flex;flex-direction:column;gap:7px}
.stack-header{font-size:11px;color:var(--m);font-weight:600;padding:0 2px 6px;border-bottom:1px solid var(--b)}

/* ── COMPOSER TAB ── */
.composer-wrap{display:flex;flex-direction:column;gap:16px}
.comp-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--b)}
.tool-group{display:flex;gap:6px;align-items:center}
.tool-sep{width:1px;height:26px;background:var(--b);margin:0 4px}
.comp-btn{border:1px solid var(--b);border-radius:7px;padding:6px 11px;font-size:11px;color:var(--m);background:transparent;cursor:pointer;transition:all .13s;white-space:nowrap;font-family:inherit;font-weight:600}
.comp-btn:hover{color:var(--t);border-color:var(--b2);background:rgba(255,255,255,.03)}
.comp-btn.active{background:rgba(61,252,190,.08);border-color:rgba(61,252,190,.3);color:var(--a)}
.comp-select{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:5px 9px;font-size:11px;color:var(--t);cursor:pointer;outline:none;font-family:inherit}
.comp-select:focus{border-color:var(--a)}
.piano-roll-wrap{position:relative;overflow:auto;background:var(--bg);cursor:crosshair;user-select:none;scrollbar-width:thin;scrollbar-color:var(--d) transparent}
.piano-roll-canvas{display:block}
.comp-key-wrap{display:flex;flex-direction:column;border-right:1px solid var(--b2);background:var(--s1);flex-shrink:0}
.key-row{display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid rgba(255,255,255,.025);cursor:pointer;transition:background .1s;padding-right:6px}
.key-row.black-key{background:rgba(0,0,0,.35)}
.key-row:hover{background:rgba(61,252,190,.05)}
.key-label{font-family:var(--mono);font-size:8px;color:var(--m)}
.comp-layout{display:flex;align-items:flex-start}
.comp-bottom{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--b);flex-wrap:wrap;align-items:center}
.comp-stat{font-size:11px;color:var(--m)}
.comp-stat b{color:var(--t)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--d);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--m)}

@media(max-width:900px){.main-grid,.compiler-grid{grid-template-columns:1fr}.hdr{flex-direction:column}.stats-col{flex-direction:row;flex-wrap:wrap;min-width:0}}
@media(max-width:540px){.r2,.r3{grid-template-columns:1fr}.btn-row{flex-direction:column}}

/* ── PASSWORD GATE ── */
#gate{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
}
#gate::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(77,255,200,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(77,255,200,.028) 1px,transparent 1px);
  background-size:52px 52px;
}
.gate-orb1{position:absolute;width:500px;height:500px;border-radius:50%;filter:blur(90px);background:rgba(77,255,200,.07);top:-180px;left:-120px;pointer-events:none;animation:orbmove 20s ease-in-out infinite alternate}
.gate-orb2{position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(90px);background:rgba(139,111,255,.06);bottom:-120px;right:-80px;pointer-events:none;animation:orbmove 20s ease-in-out infinite alternate reverse}
.gate-box{
  position:relative;z-index:1;
  background:var(--s1);border:1px solid var(--b);border-radius:22px;
  padding:44px 48px;display:flex;flex-direction:column;align-items:center;gap:24px;
  max-width:480px;width:90%;text-align:center;
  box-shadow:0 0 80px rgba(77,255,200,.04);
}
.gate-logo{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--t)}
.gate-logo span{color:var(--a)}
.gate-sub{font-family:var(--mono);font-size:11px;color:var(--m);line-height:1.7}
.gate-label{font-family:var(--mono);font-size:10px;color:var(--a);letter-spacing:.12em;text-transform:uppercase;align-self:flex-start}
.gate-input-wrap{width:100%;position:relative}
.gate-input{
  width:100%;background:var(--s2);border:1px solid var(--b);border-radius:12px;
  padding:13px 48px 13px 16px;font-family:var(--mono);font-size:13px;color:var(--t);
  outline:none;transition:border-color .18s,box-shadow .18s;letter-spacing:.04em;
  -webkit-appearance:none;
}
.gate-input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(77,255,200,.1)}
.gate-input.wrong{border-color:var(--err);box-shadow:0 0 0 3px rgba(255,77,106,.1);animation:shake .35s ease}
.gate-input.right{border-color:var(--ok);box-shadow:0 0 0 3px rgba(77,255,200,.15)}
.gate-eye{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--m);font-size:16px;
  padding:4px;transition:color .15s;line-height:1;
}
.gate-eye:hover{color:var(--t)}
.gate-hint{font-family:var(--mono);font-size:11px;height:18px;transition:color .2s}
.gate-hint.err{color:var(--err)}
.gate-hint.ok{color:var(--ok)}
.gate-btn{
  width:100%;border:none;border-radius:12px;padding:13px;
  background:var(--a);color:#040f0a;font-family:var(--ui);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .17s;letter-spacing:.02em;
}
.gate-btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 0 28px rgba(77,255,200,.3)}
.gate-btn:active{transform:scale(.98)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes gateOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.04)}}
#gate.unlocking{animation:gateOut .45s ease forwards}
</style>
</head>
<body>

<!-- ── PASSWORD GATE ── -->
<div id="gate">
  <div class="gate-orb1"></div>
  <div class="gate-orb2"></div>
  <div class="gate-box">
    <div class="gate-logo">MIDI<span>→</span>GRAB</div>
    <p class="gate-sub">This tool is password protected.<br>Enter the access code to continue.</p>
    <span class="gate-label">Access Code</span>
    <div class="gate-input-wrap">
      <input class="gate-input" id="gateInput" type="password" placeholder="enter password…" autocomplete="off" spellcheck="false"/>
      <button class="gate-eye" id="gateEye" title="Show/hide" tabindex="-1">👁</button>
    </div>
    <div class="gate-hint" id="gateHint">&nbsp;</div>
    <button class="gate-btn" id="gateBtn">Unlock →</button>
  </div>
</div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- ── TOP NAV ── -->
<div style="position:relative;z-index:2;background:var(--s1);border-bottom:1px solid var(--b);padding:10px 24px;display:flex;align-items:center;gap:14px">
  <a href="https://bananamasters-tool-hub.vercel.app" style="display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--m);text-decoration:none;padding:6px 12px;border:1px solid var(--b);border-radius:8px;transition:all .15s" onmouseover="this.style.color='var(--a)';this.style.borderColor='rgba(77,255,200,.3)'" onmouseout="this.style.color='var(--m)';this.style.borderColor='var(--b)'">← Tool Hub</a>
  <span style="font-family:var(--mono);font-size:11px;color:var(--m)">/ MIDI → Grab</span>
  <button id="tutorialToggle" style="margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--a2);background:rgba(139,111,255,.08);border:1px solid rgba(139,111,255,.3);border-radius:8px;padding:6px 14px;cursor:pointer;transition:all .15s">📖 Tutorial</button>
</div>

<!-- ── TUTORIAL PANEL ── -->
